  <path d="M 4 14 L 4 7 C 4 5.3 5.3 4 7 4 L 14 4" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right Bracket -->
  <path d="M 46 4 L 53 4 C 54.7 4 56 5.3 56 7 L 56 14" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left Bracket -->
  <path d="M 4 26 L 4 33 C 4 34.7 5.3 36 7 36 L 14 36" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right Bracket -->
  <path d="M 46 36 L 53 36 C 54.7 36 56 34.7 56 33 L 56 26" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Exactly Six Vertical Barcode Lines with balanced spacing and varying weights -->
  <line x1="18.5" y1="10.5" x2="18.5" y2="29.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="24.0" y1="10.5" x2="24.0" y2="29.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  <line x1="29.0" y1="10.5" x2="29.0" y2="29.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
  <line x1="34.0" y1="10.5" x2="34.0" y2="29.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  <line x1="39.0" y1="10.5" x2="39.0" y2="29.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
  <line x1="44.0" y1="10.5" x2="44.0" y2="29.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
</svg>
